<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소방시설 종합점검 통합 관리 시스템</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for parsing JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SheetJS for Excel Upload -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
  <!-- Firebase App & Firestore (Compat 버전을 사용하여 HTML내에서 쉽게 호출) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // 1. Firebase 설정 및 초기화
    const firebaseConfig = {
      apiKey: "AIzaSyAo6uhvr2T-ZMfdbQ_Ck4mSGsialQ7hZEI",
      authDomain: "fire-inspection-dash.firebaseapp.com",
      projectId: "fire-inspection-dash",
      storageBucket: "fire-inspection-dash.firebasestorage.app",
      messagingSenderId: "569597734948",
      appId: "1:569597734948:web:5c40bbd1fd09602e1668b1",
      measurementId: "G-6QK465Y0N7"
    };

    // Firebase가 중복 초기화되지 않도록 체크
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 2. 메인 App 컴포넌트
    const App = () => {
      const [data, setData] = useState([]);
      const [filterBuilding, setFilterBuilding] = useState('전체');
      const [filterStatus, setFilterStatus] = useState('전체');
      const [filterCategory, setFilterCategory] = useState('전체');
      const [searchTerm, setSearchTerm] = useState('');
      const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });
      const [viewMode, setViewMode] = useState('date');
      
      const [isUploading, setIsUploading] = useState(false);
      const [notification, setNotification] = useState(null);
      const [selectedItem, setSelectedItem] = useState(null);
      const [isLoading, setIsLoading] = useState(true);

      const fileInputRef = useRef(null);

      useEffect(() => {
        // Firebase Firestore 실시간 감시 (onSnapshot)
        const unsubscribe = db.collection("inspections").onSnapshot(
          (snapshot) => {
            const fireStoreData = snapshot.docs.map(doc => ({
              id: doc.id,
              ...doc.data()
            }));
            setData(fireStoreData);
            setIsLoading(false);
          }, 
          (error) => {
            console.error("Firebase 연동 에러:", error);
            showToast("데이터베이스 연결 실패. 규칙 설정을 확인하세요.", "error");
            setIsLoading(false);
          }
        );

        return () => unsubscribe();
      }, []);

      // 토스트 알림 타이머
      useEffect(() => {
        if (notification) {
          const timer = setTimeout(() => setNotification(null), 3500);
          return () => clearTimeout(timer);
        }
      }, [notification]);

      const showToast = (message, type = 'info') => {
        setNotification({ message, type });
      };

      const formatDate = (dateStr) => {
        if (!dateStr) return '';
        const clean = dateStr.toString().replace(/[./]/g, '-').replace(/\s/g, '').trim();
        const parts = clean.split('-');
        if (parts.length === 3) {
          const year = parts[0].length === 2 ? `20${parts[0]}` : parts[0];
          const month = parts[1].padStart(2, '0');
          const day = parts[2].padStart(2, '0');
          return `${year}-${month}-${day}`;
        }
        return clean;
      };

      const normalizeBuilding = (str) => {
        if (!str) return '기타동';
        const trimmed = str.toString().trim();
        if (trimmed.includes('A')) return 'A동';
        if (trimmed.includes('B')) return 'B동';
        if (trimmed.includes('C')) return 'C동';
        if (trimmed.includes('D')) return 'D동';
        return trimmed.endsWith('동') ? trimmed : `${trimmed}동`;
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsUploading(true);
        const reader = new FileReader();

        reader.onload = async (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = window.XLSX.read(bstr, { type: 'binary' });
            const wsname = wb.SheetNames[0];
            const ws = wb.Sheets[wsname];
            const rawRows = window.XLSX.utils.sheet_to_json(ws, { header: 1 });

            let headerIndex = -1;
            for (let i = 0; i < Math.min(rawRows.length, 15); i++) {
              const rowText = (rawRows[i] || []).join(' ');
              if (rowText.includes('No.') || (rowText.includes('점검일자') && rowText.includes('문제점'))) {
                headerIndex = i;
                break;
              }
            }

            if (headerIndex === -1) throw new Error("양식을 찾지 못했습니다. 'No.' 또는 '점검일자' 열을 확인해주세요.");

            const newItems = [];
            for (let i = headerIndex + 1; i < rawRows.length; i++) {
              const row = rawRows[i];
              if (!row || row.length < 5) continue;

              const dateVal = formatDate(row[1]);
              const issueVal = row[6] || row[5] || '';
              if (!dateVal && !issueVal) continue;

              const completionVal = formatDate(row[13]);
              const statusVal = completionVal ? '완료' : (row[12] === '완료' ? '완료' : '조치중');

              newItems.push({
                date: dateVal || '2026-04-01',
                category: row[2] || '기타설비',
                subCategory: row[3] || '일반',
                building: normalizeBuilding(row[4]),
                zone: row[5] || '공용구역',
                issue: issueVal.toString().trim(),
                plan: row[7] || row[8] || '보수 및 정비',
                completionDate: completionVal,
                status: statusVal,
                remark: row[14] || row[13] || ''
              });
            }

            if (newItems.length > 0) {
              // Firebase 일괄 저장 (Batch Write)
              const batch = db.batch();
              newItems.forEach(item => {
                const newDocRef = db.collection("inspections").doc();
                batch.set(newDocRef, item);
              });
              
              await batch.commit();
              showToast(`${newItems.length}건이 성공적으로 추가되었습니다!`, 'success');
            } else {
              showToast('유효한 데이터가 없습니다.', 'warning');
            }
          } catch (err) {
            showToast(err.message, 'error');
          } finally {
            setIsUploading(false);
          }
        };

        reader.readAsBinaryString(file);
        e.target.value = null;
      };

      const handleToggleStatus = async (id) => {
        const itemToUpdate = data.find(item => item.id === id);
        if (!itemToUpdate) return;

        const isNowCompleted = itemToUpdate.status !== '완료';
        const today = new Date().toISOString().split('T')[0];
        
        try {
          await db.collection("inspections").doc(id).update({
            status: isNowCompleted ? '완료' : '조치중',
            completionDate: isNowCompleted ? today : ''
          });
          showToast('조치 상태가 변경되었습니다.', 'info');
        } catch (error) {
          showToast('상태 갱신 실패: ' + error.message, 'error');
        }
      };

      const uniqueCategories = useMemo(() => {
        return ['전체', ...Array.from(new Set(data.map(d => d.category).filter(Boolean)))];
      }, [data]);

      const filteredData = useMemo(() => {
        return data.filter(item => {
          const matchBuilding = filterBuilding === '전체' || item.building === filterBuilding;
          const matchStatus = filterStatus === '전체' || item.status === filterStatus;
          const matchCategory = filterCategory === '전체' || item.category === filterCategory;
          const search = searchTerm.toLowerCase();
          const matchSearch = 
            item.issue.toLowerCase().includes(search) || 
            item.zone.toLowerCase().includes(search) ||
            item.building.toLowerCase().includes(search) ||
            item.subCategory.toLowerCase().includes(search) ||
            (item.remark && item.remark.toLowerCase().includes(search));

          return matchBuilding && matchStatus && matchCategory && matchSearch;
        }).sort((a, b) => {
          if (sortConfig.key === 'date') {
            const tA = new Date(a.date).getTime() || 0;
            const tB = new Date(b.date).getTime() || 0;
            return sortConfig.direction === 'asc' ? tA - tB : tB - tA;
          }
          return 0;
        });
      }, [data, filterBuilding, filterStatus, filterCategory, searchTerm, sortConfig]);

      const groupedSections = useMemo(() => {
        if (viewMode === 'list') return null;

        const map = {};
        filteredData.forEach(item => {
          let key = '';
          if (viewMode === 'date') key = item.date || '날짜미지정';
          else if (viewMode === 'building') key = item.building || '미지정동';
          else if (viewMode === 'category') key = item.category || '기타설비';

          if (!map[key]) map[key] = [];
          map[key].push(item);
        });

        const keys = Object.keys(map);
        if (viewMode === 'date') keys.sort((a, b) => new Date(b).getTime() - new Date(a).getTime());
        else keys.sort((a, b) => a.localeCompare(b));

        return keys.map(k => ({
          key: k,
          items: map[k],
          completedCount: map[k].filter(i => i.status === '완료').length,
          pendingCount: map[k].filter(i => i.status !== '완료').length
        }));
      }, [filteredData, viewMode]);

      // 통계
      const stats = useMemo(() => {
        const total = data.length;
        const completed = data.filter(d => d.status === '완료').length;
        const pending = total - completed;
        const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

        const buildingCounts = {};
        data.forEach(d => {
          if (!buildingCounts[d.building]) buildingCounts[d.building] = { total: 0, completed: 0 };
          buildingCounts[d.building].total += 1;
          if (d.status === '완료') buildingCounts[d.building].completed += 1;
        });

        return { total, completed, pending, rate, buildingCounts };
      }, [data]);

      return (
        <div className="min-h-screen p-3 sm:p-6 lg:p-8 selection:bg-rose-500 selection:text-white">
          
          {/* Toast Notification */}
          {notification && (
            <div className={`fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border backdrop-blur-md transition-all animate-bounce ${
              notification.type === 'success' ? 'bg-emerald-950/90 border-emerald-500 text-emerald-200' :
              notification.type === 'error' ? 'bg-rose-950/90 border-rose-500 text-rose-200' :
              'bg-slate-800/90 border-slate-600 text-slate-200'
            }`}>
              {notification.type === 'success' ? <i className="fas fa-check-circle text-emerald-400"></i> : <i className="fas fa-exclamation-triangle text-rose-400"></i>}
              <span className="text-sm font-semibold">{notification.message}</span>
            </div>
          )}

          <div className="max-w-7xl mx-auto space-y-6">
            
            {/* Header */}
            <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-800/60 border border-slate-700/80 p-5 rounded-2xl backdrop-blur-sm shadow-xl">
              <div>
                <div className="flex items-center gap-2 mb-2">
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30">
                    <i className="fas fa-shield-halved text-rose-400"></i>
                    소방시설법 제22조 이력관리
                  </span>
                  <span className="text-xs text-slate-400 font-mono">원그로브 안전방재센터</span>
                  {isLoading && <span className="text-[10px] text-blue-400 font-bold animate-pulse px-2 py-0.5 bg-blue-900/50 rounded-full border border-blue-800">DB 연동중...</span>}
                </div>
                <h1 className="text-xl sm:text-2xl font-black tracking-tight text-white flex items-center gap-2.5">
                  <i className="fas fa-chart-pie text-rose-500"></i>
                  종합점검 통합 관제 대시보드
                </h1>
              </div>

              <div className="flex flex-wrap items-center gap-2.5">
                <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".xlsx, .xls, .csv" className="hidden" />
                <button 
                  onClick={() => fileInputRef.current?.click()}
                  disabled={isUploading}
                  className="flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm shadow-lg transition-all bg-rose-600 hover:bg-rose-500 text-white"
                >
                  {isUploading ? <i className="fas fa-sync fa-spin"></i> : <i className="fas fa-upload"></i>}
                  점검일보 업로드
                </button>
              </div>
            </header>

            {}
            <section className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
              <div className="bg-slate-800/80 border border-slate-700 p-4 sm:p-5 rounded-2xl">
                <div className="flex justify-between items-start">
                  <div>
                    <p className="text-[11px] font-bold uppercase text-slate-400">총 누적 지적건수</p>
                    <div className="text-2xl sm:text-3xl font-black text-white mt-1">{stats.total} <span className="text-xs font-normal text-slate-400">건</span></div>
                  </div>
                  <div className="p-2.5 rounded-xl bg-blue-500/10 text-blue-400"><i className="fas fa-clipboard-check text-xl"></i></div>
                </div>
              </div>
              <div className="bg-slate-800/80 border border-slate-700 p-4 sm:p-5 rounded-2xl">
                <div className="flex justify-between items-start">
                  <div>
                    <p className="text-[11px] font-bold uppercase text-slate-400">조치 완료</p>
                    <div className="text-2xl sm:text-3xl font-black text-emerald-400 mt-1">{stats.completed} <span className="text-xs font-normal text-slate-400">건</span></div>
                  </div>
                  <div className="p-2.5 rounded-xl bg-emerald-500/10 text-emerald-400"><i className="fas fa-check-circle text-xl"></i></div>
                </div>
              </div>
              <div className="bg-slate-800/80 border border-slate-700 p-4 sm:p-5 rounded-2xl">
                <div className="flex justify-between items-start">
                  <div>
                    <p className="text-[11px] font-bold uppercase text-slate-400">조치 대기 (미조치)</p>
                    <div className="text-2xl sm:text-3xl font-black text-amber-400 mt-1">{stats.pending} <span className="text-xs font-normal text-slate-400">건</span></div>
                  </div>
                  <div className="p-2.5 rounded-xl bg-amber-500/10 text-amber-400"><i className="fas fa-clock text-xl"></i></div>
                </div>
              </div>
              <div className="bg-slate-800/80 border border-slate-700 p-4 sm:p-5 rounded-2xl flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center">
                    <p className="text-[11px] font-bold uppercase text-slate-400">종합 진척도</p>
                    <span className="text-lg font-black text-rose-400">{stats.rate}%</span>
                  </div>
                  <div className="w-full bg-slate-700/60 h-2.5 rounded-full mt-2.5 overflow-hidden">
                    <div className={`h-full rounded-full transition-all duration-700 ${stats.rate >= 80 ? 'bg-emerald-500' : stats.rate >= 50 ? 'bg-blue-500' : 'bg-rose-500'}`} style={{ width: `${stats.rate}%` }}/>
                  </div>
                </div>
              </div>
            </section>

            {}
            <section className="bg-slate-800/60 border border-slate-700/80 p-4 rounded-2xl space-y-3">
              <div className="flex flex-wrap items-center gap-3">
                <div className="flex items-center gap-2 bg-slate-900/80 border border-slate-700 px-3 py-1.5 rounded-xl">
                  <i className="fas fa-building text-slate-400"></i>
                  <select value={filterBuilding} onChange={(e) => setFilterBuilding(e.target.value)} className="bg-transparent text-sm font-semibold text-slate-200 outline-none">
                    <option value="전체" className="bg-slate-800">동 전체</option>
                    <option value="A동" className="bg-slate-800">업무 A동</option>
                    <option value="B동" className="bg-slate-800">업무 B동</option>
                    <option value="C동" className="bg-slate-800">업무 C동</option>
                    <option value="D동" className="bg-slate-800">업무 D동</option>
                  </select>
                </div>

                <div className="flex items-center gap-2 bg-slate-900/80 border border-slate-700 px-3 py-1.5 rounded-xl">
                  <i className="fas fa-filter text-slate-400"></i>
                  <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} className="bg-transparent text-sm font-semibold text-slate-200 outline-none">
                    <option value="전체" className="bg-slate-800">상태 전체</option>
                    <option value="완료" className="bg-slate-800">✅ 조치완료만</option>
                    <option value="조치중" className="bg-slate-800">⏳ 조치필요만</option>
                  </select>
                </div>

                <div className="flex-1 min-w-[220px] flex items-center gap-2 bg-slate-900/80 border border-slate-700 px-3.5 py-1.5 rounded-xl focus-within:border-rose-500">
                  <i className="fas fa-search text-slate-400"></i>
                  <input type="text" placeholder="검색어 입력..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full bg-transparent text-sm text-slate-200 outline-none placeholder:text-slate-500" />
                </div>
              </div>
            </section>

            {}
            <div className="bg-slate-800/70 border border-slate-700/80 rounded-2xl overflow-hidden shadow-2xl">
              
              <div className="p-3.5 bg-slate-800 border-b border-slate-700 flex flex-wrap justify-between items-center gap-3">
                <div className="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-700/80">
                  <button onClick={() => setViewMode('date')} className={`flex items-center gap-1.5 px-3 py-1.5 text-xs rounded-lg font-bold ${viewMode === 'date' ? 'bg-rose-600 text-white' : 'text-slate-400'}`}>
                    <i className="fas fa-calendar-alt"></i> 일자별
                  </button>
                  <button onClick={() => setViewMode('building')} className={`flex items-center gap-1.5 px-3 py-1.5 text-xs rounded-lg font-bold ${viewMode === 'building' ? 'bg-rose-600 text-white' : 'text-slate-400'}`}>
                    <i className="fas fa-building"></i> 동별
                  </button>
                  <button onClick={() => setViewMode('list')} className={`flex items-center gap-1.5 px-3 py-1.5 text-xs rounded-lg font-bold ${viewMode === 'list' ? 'bg-rose-600 text-white' : 'text-slate-400'}`}>
                    <i className="fas fa-list"></i> 목록
                  </button>
                </div>
                <div className="text-xs text-slate-400">조회된 항목: <strong className="text-rose-400">{filteredData.length}</strong>건</div>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-900/60 text-[11px] font-black tracking-wider text-slate-400 uppercase border-b border-slate-700/80">
                      <th className="p-3.5 pl-5 cursor-pointer hover:text-rose-400" onClick={() => setSortConfig(prev => ({key: 'date', direction: prev.direction === 'asc' ? 'desc' : 'asc'}))}>
                        점검일자 <i className={`fas fa-sort ml-1`}></i>
                      </th>
                      <th className="p-3.5">위치/구역</th>
                      <th className="p-3.5">설비/구분</th>
                      <th className="p-3.5 w-1/3">문제점 및 계획</th>
                      <th className="p-3.5 text-center">조치상태</th>
                      <th className="p-3.5 pr-5 text-right">완료일자</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-700/50 text-xs sm:text-sm">
                    {filteredData.length === 0 ? (
                      <tr><td colSpan={6} className="p-16 text-center text-slate-500">데이터가 없습니다.</td></tr>
                    ) : viewMode === 'list' ? (
                      filteredData.map(item => <InspectionTableRow key={item.id} item={item} onToggleStatus={handleToggleStatus} onSelect={() => setSelectedItem(item)} />)
                    ) : (
                      groupedSections.map(group => (
                        <React.Fragment key={group.key}>
                          <tr className="bg-slate-900/80 border-t border-b border-slate-700">
                            <td colSpan={6} className="p-2.5 pl-5">
                              <div className="flex items-center justify-between text-xs font-bold text-slate-200">
                                <div><span className="text-rose-400 mr-2">{viewMode === 'date' ? '📅' : '🏢'}</span> {group.key} ({group.items.length}건)</div>
                              </div>
                            </td>
                          </tr>
                          {group.items.map(item => <InspectionTableRow key={item.id} item={item} onToggleStatus={handleToggleStatus} onSelect={() => setSelectedItem(item)} />)}
                        </React.Fragment>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
            
            {}
            {selectedItem && (
              <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-2xl shadow-2xl p-6 relative">
                  <button onClick={() => setSelectedItem(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><i className="fas fa-times text-lg"></i></button>
                  <h3 className="font-bold text-lg text-white mb-4">점검 세부 지적 정보</h3>
                  <div className="space-y-4 text-sm text-slate-300">
                    <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-700">
                      <span className="text-slate-400 font-bold block mb-1">지적 사항</span>
                      <p className="text-white">{selectedItem.issue}</p>
                    </div>
                    <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-700">
                      <span className="text-slate-400 font-bold block mb-1">조치 계획</span>
                      <p className="text-white">{selectedItem.plan || '계획 없음'}</p>
                    </div>
                    {selectedItem.remark && (
                      <div className="p-2.5 bg-slate-900/40 rounded-lg text-slate-400 text-xs">비고: {selectedItem.remark}</div>
                    )}
                    <button onClick={() => { handleToggleStatus(selectedItem.id); setSelectedItem(null); }} className={`w-full py-3 rounded-xl font-bold text-white shadow-md ${selectedItem.status === '완료' ? 'bg-amber-600' : 'bg-emerald-600'}`}>
                      {selectedItem.status === '완료' ? '조치중 상태로 되돌리기' : '조치완료 처리하기'}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // 개별 테이블 행 컴포넌트
    function InspectionTableRow({ item, onToggleStatus, onSelect }) {
      const isComplete = item.status === '완료';
      return (
        <tr className="hover:bg-slate-700/40 transition-colors group cursor-pointer" onClick={onSelect}>
          <td className="p-3.5 pl-5 font-mono text-xs text-slate-400 whitespace-nowrap">{item.date}</td>
          <td className="p-3.5 whitespace-nowrap">
            <span className="px-2 py-0.5 rounded text-[10px] font-black border bg-slate-950/80 text-slate-300 border-slate-700">{item.building}</span>
            <span className="ml-2 font-semibold text-slate-200 text-xs truncate">{item.zone}</span>
          </td>
          <td className="p-3.5 whitespace-nowrap">
            <div className="font-bold text-slate-200 text-xs">{item.category}</div>
            <div className="text-[11px] text-slate-400">{item.subCategory}</div>
          </td>
          <td className="p-3.5">
            <div className="text-xs text-slate-200 font-medium truncate max-w-xs">{item.issue}</div>
          </td>
          <td className="p-3.5 text-center whitespace-nowrap">
            <button
              onClick={(e) => { e.stopPropagation(); onToggleStatus(item.id); }}
              className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-black shadow-sm ${isComplete ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-amber-500/20 text-amber-300 border border-amber-500/40 animate-pulse'}`}
            >
              {isComplete ? <i className="fas fa-check"></i> : <i className="fas fa-clock"></i>}
              {item.status}
            </button>
          </td>
          <td className="p-3.5 pr-5 font-mono text-xs text-right whitespace-nowrap">
            {item.completionDate ? <span className="text-emerald-400 font-bold">{item.completionDate}</span> : <span className="text-slate-600 italic">진행중</span>}
          </td>
        </tr>
      );
    }

    // React 앱 마운트
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
