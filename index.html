<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소방시설 종합점검 통합 관리 시스템</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome (Icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- SheetJS for Excel Upload -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
  <!-- Firebase App & Firestore & Storage (Compat ver for CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-storage-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyAo6uhvr2T-ZMfdbQ_Ck4mSGsialQ7hZEI",
      authDomain: "fire-inspection-dash.firebaseapp.com",
      projectId: "fire-inspection-dash",
      storageBucket: "fire-inspection-dash.firebasestorage.app",
      messagingSenderId: "569597734948",
      appId: "1:569597734948:web:5c40bbd1fd09602e1668b1",
      measurementId: "G-6QK465Y0N7"
    };

    // Firebase 초기화
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const storage = firebase.storage();

    const App = () => {
      // 데이터 및 필터 상태
      const [data, setData] = useState([]);
      const [filterBuilding, setFilterBuilding] = useState('전체');
      const [filterStatus, setFilterStatus] = useState('전체');
      const [searchTerm, setSearchTerm] = useState('');
      const [viewMode, setViewMode] = useState('list');
      const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });
      
      // UI 상태
      const [isUploading, setIsUploading] = useState(false);
      const [notification, setNotification] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      
      // 모달 상태
      const [isDetailModalOpen, setIsDetailModalOpen] = useState(false);
      const [selectedItem, setSelectedItem] = useState(null);
      const [imageUploadProgress, setImageUploadProgress] = useState(0);

      const fileInputRef = useRef(null);
      const imageInputRef = useRef(null);

      // 1. Firebase Firestore 실시간 연동
      useEffect(() => {
        const unsubscribe = db.collection("inspections").onSnapshot((snapshot) => {
          const fireStoreData = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));
          setData(fireStoreData);
          setIsLoading(false);
        }, (error) => {
          console.error("DB 연동 에러:", error);
          showToast("DB 연결 실패. 규칙을 확인하세요.", "error");
          setIsLoading(false);
        });
        return () => unsubscribe();
      }, []);

      const showToast = (message, type = 'info') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 3000);
      };

      // 날짜 포맷 (엑셀 날짜 변환 포함)
      const formatDate = (dateStr) => {
        if (!dateStr) return '';
        if (typeof dateStr === 'number') {
          const date = new Date((dateStr - (25567 + 2)) * 86400 * 1000);
          return date.toISOString().split('T')[0];
        }
        return dateStr.toString().replace(/[./]/g, '-').replace(/\s/g, '').trim();
      };

      const normalizeBuilding = (str) => {
        if (!str) return '기타동';
        const trimmed = str.toString().trim().replace(/동/g, '');
        return `${trimmed}동`;
      };

      // 2. 엑셀/CSV 업로드 및 스마트 파싱
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsUploading(true);
        const reader = new FileReader();

        reader.onload = async (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = window.XLSX.read(bstr, { type: 'binary', cellDates: true });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rawRows = window.XLSX.utils.sheet_to_json(ws, { header: 1 });

            let headerIndex = -1;
            let map = {};

            // 헤더 위치 자동 감지
            for (let i = 0; i < Math.min(rawRows.length, 15); i++) {
              const rowText = (rawRows[i] || []).join('');
              if (rowText.includes('점검일자') && (rowText.includes('문제점') || rowText.includes('지적'))) {
                headerIndex = i;
                rawRows[i].forEach((col, idx) => {
                  if(!col) return;
                  const text = col.toString().replace(/\s/g, '');
                  if(text.includes('점검일자')) map.date = idx;
                  if(text.includes('시설') || text.includes('설비')) map.cat = idx;
                  if(text.includes('상세')) map.sub = idx;
                  if(text.includes('동별')) map.bld = idx;
                  if(text.includes('층') || text.includes('위치')) map.zone = idx;
                  if(text.includes('문제점') || text.includes('지적')) map.issue = idx;
                  if(text.includes('대책') || text.includes('계획')) map.plan = idx;
                  if(text.includes('완료일')) map.comp = idx;
                  if(text.includes('비고')) map.remark = idx;
                });
                break;
              }
            }

            if (headerIndex === -1) throw new Error("양식을 인식할 수 없습니다. '점검일자' 및 '문제점' 헤더가 필요합니다.");

            const batch = db.batch();
            let count = 0;

            for (let i = headerIndex + 1; i < rawRows.length; i++) {
              const row = rawRows[i];
              if (!row || row.length < 5) continue;
              
              const dateVal = formatDate(row[map.date]);
              const issueVal = row[map.issue] || '';
              if (!dateVal && !issueVal) continue;

              const completionVal = formatDate(row[map.comp]);
              
              const newDocRef = db.collection("inspections").doc();
              batch.set(newDocRef, {
                date: dateVal,
                category: row[map.cat] || '기타',
                subCategory: row[map.sub] || '',
                building: normalizeBuilding(row[map.bld]),
                zone: row[map.zone] || '',
                issue: issueVal.toString(),
                plan: row[map.plan] || '',
                completionDate: completionVal,
                status: completionVal ? '완료' : '조치중',
                remark: row[map.remark] || '',
                imageUrl: ''
              });
              count++;
            }

            await batch.commit();
            showToast(`${count}건의 점검 내역 업로드 완료!`, 'success');
          } catch (err) {
            showToast(err.message, 'error');
          } finally {
            setIsUploading(false);
          }
        };
        reader.readAsBinaryString(file);
        e.target.value = null;
      };

      // 3. 사진 업로드 (Firebase Storage)
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !selectedItem) return;

        if (file.size > 5 * 1024 * 1024) {
          showToast("사진 용량은 5MB 이하여야 합니다.", "error");
          return;
        }

        const fileExt = file.name.split('.').pop();
        const fileName = `inspection_${selectedItem.id}_${Date.now()}.${fileExt}`;
        const storageRef = storage.ref(`inspections/${fileName}`);
        
        const uploadTask = storageRef.put(file);

        uploadTask.on('state_changed', 
          (snapshot) => {
            const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
            setImageUploadProgress(progress);
          }, 
          (error) => {
            console.error(error);
            showToast("사진 업로드 실패", "error");
            setImageUploadProgress(0);
          }, 
          async () => {
            const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
            
            await db.collection("inspections").doc(selectedItem.id).update({
              imageUrl: downloadURL
            });
            
            setSelectedItem(prev => ({ ...prev, imageUrl: downloadURL }));
            setImageUploadProgress(0);
            showToast("사진이 성공적으로 첨부되었습니다.", "success");
          }
        );
      };

      // 4. 상태 토글
      const handleToggleStatus = async (id, currentStatus) => {
        const isNowCompleted = currentStatus !== '완료';
        const today = new Date().toISOString().split('T')[0];
        try {
          await db.collection("inspections").doc(id).update({
            status: isNowCompleted ? '완료' : '조치중',
            completionDate: isNowCompleted ? today : ''
          });
          showToast(isNowCompleted ? '완료 처리되었습니다.' : '조치중으로 변경되었습니다.', 'success');
        } catch (error) {
          showToast('상태 변경 실패', 'error');
        }
      };

      // 데이터 가공 및 필터링
      const processedData = useMemo(() => {
        return data.filter(item => {
          const matchBuilding = filterBuilding === '전체' || item.building === filterBuilding;
          const matchStatus = filterStatus === '전체' || item.status === filterStatus;
          const search = searchTerm.toLowerCase();
          const matchSearch = item.issue.toLowerCase().includes(search) || 
                              item.zone.toLowerCase().includes(search) ||
                              item.category.toLowerCase().includes(search);
          return matchBuilding && matchStatus && matchSearch;
        }).sort((a, b) => {
          const dateA = new Date(a.date.replace(/-/g, '/'));
          const dateB = new Date(b.date.replace(/-/g, '/'));
          return sortConfig.direction === 'asc' ? dateA - dateB : dateB - dateA;
        });
      }, [data, filterBuilding, filterStatus, searchTerm, sortConfig]);

      // 그룹화
      const groupedData = useMemo(() => {
        if (viewMode === 'list') return null;
        const groups = {};
        processedData.forEach(item => {
          const key = viewMode === 'date' ? (item.date || '날짜 미상') : item.building;
          if (!groups[key]) groups[key] = [];
          groups[key].push(item);
        });

        const sortedKeys = Object.keys(groups).sort((a, b) => {
          if (viewMode === 'date') {
            return new Date(b.replace(/\./g, '-')) - new Date(a.replace(/\./g, '-'));
          }
          return a.localeCompare(b);
        });

        return sortedKeys.map(key => ({ key, items: groups[key] }));
      }, [processedData, viewMode]);

      // 통계
      const stats = useMemo(() => {
        const total = data.length;
        const completed = data.filter(d => d.status === '완료').length;
        const pending = total - completed;
        const rate = total > 0 ? Math.round((completed / total) * 100) : 0;
        return { total, completed, pending, rate };
      }, [data]);

      // 정렬 핸들러
      const requestSort = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') {
          direction = 'desc';
        }
        setSortConfig({ key, direction });
      };

      return (
        <div className="min-h-screen p-4 md:p-8">
          {/* Toast Notification */}
          {notification && (
            <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[100] bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 animate-in">
              {notification.type === 'success' ? <i className="fas fa-check-circle text-emerald-400"></i> : <i className="fas fa-times-circle text-rose-400"></i>}
              <span className="font-medium text-sm">{notification.message}</span>
            </div>
          )}

          <div className="max-w-7xl mx-auto space-y-6">
            
            {/* Header */}
            <header className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="bg-blue-50 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded border border-blue-100 uppercase">원그로브 안전방재센터</span>
                  {isLoading && <span className="text-[10px] text-slate-400 animate-pulse"><i className="fas fa-wifi"></i> DB 동기화 중...</span>}
                </div>
                <h1 className="text-2xl font-black text-slate-800 flex items-center gap-2">
                  <i className="fas fa-shield-alt text-blue-600"></i>
                  종합점검 이력 관제 대시보드
                </h1>
                <p className="text-slate-500 text-sm mt-1">엑셀 점검일보 업로드 및 현장 사진 클라우드 동기화 지원</p>
              </div>
              
              <div className="flex flex-wrap items-center gap-2">
                <button 
                  onClick={() => showToast("신규 등록 모달 개발중", "info")}
                  className="flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm bg-slate-800 hover:bg-slate-700 text-white shadow-sm transition-all"
                >
                  <i className="fas fa-plus-circle"></i> 현장 직접 등록
                </button>
                
                <div className="w-px h-8 bg-slate-200 mx-1 hidden sm:block"></div>

                <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".xlsx, .xls, .csv" className="hidden" />
                <button 
                  onClick={() => fileInputRef.current.click()}
                  disabled={isUploading}
                  className="flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition-all disabled:opacity-50"
                >
                  {isUploading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-file-excel"></i>}
                  엑셀 일괄 업로드
                </button>
              </div>
            </header>

            {/* Stats */}
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
              <StatCard title="총 누적 지적건수" value={stats.total} icon="fa-clipboard-list" color="blue" />
              <StatCard title="조치 완료" value={stats.completed} icon="fa-check-circle" color="emerald" />
              <StatCard title="조치 대기" value={stats.pending} icon="fa-clock" color="amber" />
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-center">
                <div className="flex justify-between items-center mb-3">
                  <span className="text-[11px] font-black text-slate-400 uppercase">종합 조치율</span>
                  <div className="text-blue-600 text-xl font-black">{stats.rate}%</div>
                </div>
                <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                  <div className="bg-blue-500 h-full rounded-full transition-all duration-700" style={{ width: `${stats.rate}%` }}></div>
                </div>
              </div>
            </div>

            {/* Filters */}
            <div className="flex flex-col md:flex-row gap-3 bg-white p-3 rounded-2xl shadow-sm border border-slate-200">
              <div className="flex bg-slate-100 p-1 rounded-xl">
                <button onClick={() => setViewMode('list')} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${viewMode === 'list' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>
                  <i className="fas fa-list"></i> 목록
                </button>
                <button onClick={() => setViewMode('date')} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${viewMode === 'date' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>
                  <i className="fas fa-calendar-day"></i> 일자별
                </button>
                <button onClick={() => setViewMode('building')} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${viewMode === 'building' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>
                  <i className="fas fa-building"></i> 동별
                </button>
              </div>

              <div className="h-8 w-px bg-slate-200 hidden md:block mx-1"></div>

              <div className="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200">
                <i className="fas fa-building text-slate-400 text-sm"></i>
                <select value={filterBuilding} onChange={(e) => setFilterBuilding(e.target.value)} className="bg-transparent text-sm font-bold outline-none cursor-pointer">
                  <option value="전체">모든 동</option>
                  <option value="A동">A동</option>
                  <option value="B동">B동</option>
                  <option value="C동">C동</option>
                  <option value="D동">D동</option>
                </select>
              </div>
              
              <div className="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200">
                <i className="fas fa-filter text-slate-400 text-sm"></i>
                <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} className="bg-transparent text-sm font-bold outline-none cursor-pointer">
                  <option value="전체">모든 상태</option>
                  <option value="완료">완료</option>
                  <option value="조치중">조치중</option>
                </select>
              </div>

              <div className="flex-grow flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200 focus-within:border-blue-400">
                <i className="fas fa-search text-slate-400 text-sm"></i>
                <input type="text" placeholder="지적 내용 검색..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="bg-transparent text-sm w-full outline-none font-medium" />
              </div>
            </div>

            {/* Data Table */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50 border-b border-slate-200">
                      <th className="p-4 text-xs font-black text-slate-500 uppercase cursor-pointer hover:bg-slate-100" onClick={() => requestSort('date')}>
                        <div className="flex items-center gap-1">점검일자 <i className={`fas fa-sort${sortConfig.key === 'date' ? (sortConfig.direction === 'asc' ? '-up text-blue-500' : '-down text-blue-500') : ''}`}></i></div>
                      th>
                      <th className="p-4 text-xs font-black text-slate-500 uppercase">동/구역</th>
                      <th className="p-4 text-xs font-black text-slate-500 uppercase w-[35%]">지적 내용 및 계획</th>
                      <th className="p-4 text-xs font-black text-slate-500 uppercase text-center">현장사진</th>
                      <th className="p-4 text-xs font-black text-slate-500 uppercase text-center">상태</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {processedData.length > 0 ? (
                      viewMode === 'list' ? (
                        processedData.map(item => <InspectionRow key={item.id} item={item} onSelect={() => { setSelectedItem(item); setIsDetailModalOpen(true); }} onToggleStatus={handleToggleStatus} />)
                      ) : (
                        groupedData.map(group => (
                          <React.Fragment key={group.key}>
                            <tr className="bg-slate-100/50">
                              <td colSpan="5" className="p-3 pl-4 text-sm font-black text-slate-800 border-b border-slate-200">
                                <i className={`fas ${viewMode === 'date' ? 'fa-calendar-day' : 'fa-building'} text-blue-500 mr-2`}></i>
                                {group.key} <span className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-[10px] ml-1">{group.items.length}건</span>
                              </td>
                            </tr>
                            {group.items.map(item => <InspectionRow key={`group-${item.id}`} item={item} onSelect={() => { setSelectedItem(item); setIsDetailModalOpen(true); }} onToggleStatus={handleToggleStatus} />)}
                          </React.Fragment>
                        ))
                      )
                    ) : (
                      <tr><td colSpan="5" className="p-20 text-center text-slate-400"><i className="fas fa-folder-open text-4xl mb-3 block"></i>데이터가 없습니다.</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          {/* 5. 상세 및 사진 업로드 모달 */}
          {isDetailModalOpen && selectedItem && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-in">
                
                <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h3 className="font-black text-lg text-slate-800 flex items-center gap-2">
                    <span className="bg-slate-800 text-white px-2 py-0.5 rounded text-xs">{selectedItem.building}</span>
                    지적 사항 상세 및 조치
                  </h3>
                  <button onClick={() => setIsDetailModalOpen(false)} className="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-200 rounded-full transition-colors"><i className="fas fa-times"></i></button>
                </div>

                <div className="p-6 overflow-y-auto space-y-5">
                  {/* 사진 영역 */}
                  <div className="bg-slate-100 rounded-2xl p-2 flex flex-col items-center justify-center min-h-[250px] relative overflow-hidden group border border-slate-200">
                    {selectedItem.imageUrl ? (
                      <img src={selectedItem.imageUrl} alt="점검 사진" className="w-full h-auto max-h-[400px] object-contain rounded-xl" />
                    ) : (
                      <div className="text-center text-slate-400 space-y-3">
                        <i className="fas fa-camera text-5xl opacity-30"></i>
                        <p className="text-sm font-semibold">등록된 현장 사진이 없습니다.</p>
                      </div>
                    )}
                    
                    {/* 사진 업로드 버튼 오버레이 */}
                    <div className={`absolute inset-0 bg-slate-900/40 flex flex-col items-center justify-center transition-opacity backdrop-blur-[2px] ${selectedItem.imageUrl ? 'opacity-0 group-hover:opacity-100' : 'opacity-100'}`}>
                      <input type="file" ref={imageInputRef} onChange={handleImageUpload} accept="image/*" capture="environment" className="hidden" />
                      <button onClick={() => imageInputRef.current.click()} className="bg-white text-slate-800 px-5 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2 shadow-lg hover:bg-blue-50 hover:text-blue-600 transition-colors">
                        <i className="fas fa-upload"></i> {selectedItem.imageUrl ? '사진 변경하기' : '스마트폰/PC 사진 첨부'}
                      </button>
                      {imageUploadProgress > 0 && (
                        <div className="w-48 h-2 bg-slate-200 rounded-full mt-4 overflow-hidden shadow-inner">
                          <div className="h-full bg-blue-500 transition-all duration-300" style={{ width: `${imageUploadProgress}%` }}></div>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* 텍스트 정보 */}
                  <div className="grid grid-cols-2 gap-3 text-sm">
                    <div className="col-span-2 sm:col-span-1 bg-slate-50 p-3 rounded-xl border border-slate-200">
                      <span className="text-[11px] font-bold text-slate-500 block mb-1">위치 / 구역</span>
                      <div className="font-bold text-slate-800">{selectedItem.zone || '-'}</div>
                    </div>
                    <div className="col-span-2 sm:col-span-1 bg-slate-50 p-3 rounded-xl border border-slate-200">
                      <span className="text-[11px] font-bold text-slate-500 block mb-1">설비 구분</span>
                      <div className="font-bold text-slate-800">{selectedItem.category} &gt; {selectedItem.subCategory}</div>
                    </div>
                    <div className="col-span-2 bg-rose-50/50 p-4 rounded-xl border border-rose-200">
                      <span className="text-[11px] font-bold text-rose-500 block mb-1">지적 내용 (문제점)</span>
                      <div className="font-bold text-rose-900">{selectedItem.issue}</div>
                    </div>
                    <div className="col-span-2 bg-blue-50/50 p-4 rounded-xl border border-blue-200">
                      <span className="text-[11px] font-bold text-blue-500 block mb-1">조치 대책 / 계획</span>
                      <div className="font-bold text-blue-900">{selectedItem.plan || '내용 없음'}</div>
                    </div>
                    {selectedItem.remark && (
                      <div className="col-span-2 bg-slate-100 p-3 rounded-xl border border-slate-200">
                        <span className="text-[11px] font-bold text-slate-500 block mb-1">비고 / 작업자</span>
                        <div className="font-medium text-slate-700">{selectedItem.remark}</div>
                      </div>
                    )}
                  </div>
                </div>

                <div className="p-5 border-t border-slate-200 bg-slate-50 flex justify-between items-center">
                  <div className="text-xs font-bold text-slate-500">
                    완료일자: <span className="text-slate-800">{selectedItem.completionDate || '미완료'}</span>
                  </div>
                  <button 
                    onClick={() => { handleToggleStatus(selectedItem.id, selectedItem.status); setIsDetailModalOpen(false); }}
                    className={`px-6 py-3 rounded-xl font-bold text-sm text-white shadow-sm transition-transform active:scale-95 ${selectedItem.status === '완료' ? 'bg-slate-700 hover:bg-slate-800' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                  >
                    {selectedItem.status === '완료' ? <><i className="fas fa-undo mr-1"></i> 조치중으로 되돌리기</> : <><i className="fas fa-check mr-1"></i> 조치 완료 처리하기</>}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const StatCard = ({ title, value, icon, color }) => (
      <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 group">
        <div className="flex justify-between items-start">
          <div>
            <p className="text-[11px] font-black text-slate-400 uppercase mb-1">{title}</p>
            <h3 className="text-3xl font-black text-slate-800">{value} <span className="text-sm font-bold text-slate-400">건</span></h3>
          </div>
          <div className={`w-10 h-10 flex items-center justify-center rounded-xl bg-${color}-50 text-${color}-500 border border-${color}-100 group-hover:scale-110 transition-transform`}>
            <i className={`fas ${icon} text-lg`}></i>
          </div>
        </div>
      </div>
    );

    const InspectionRow = ({ item, onSelect, onToggleStatus }) => (
      <tr className="hover:bg-blue-50/40 transition-colors group cursor-pointer" onClick={onSelect}>
        <td className="p-4 text-sm font-semibold text-slate-600 whitespace-nowrap">{item.date}</td>
        <td className="p-4">
          <div className="flex items-center gap-2">
            <span className="w-7 h-7 flex items-center justify-center rounded-lg text-[10px] font-black shadow-sm border bg-slate-50 text-slate-600 border-slate-200">
              {item.building.charAt(0)}
            </span>
            <span className="text-sm font-bold text-slate-700 truncate max-w-[120px]">{item.zone}</span>
          </div>
        </td>
        <td className="p-4 text-sm">
          <div className="font-bold text-slate-800 mb-0.5">{item.issue}</div>
          <div className="text-[11px] font-medium text-slate-400 flex items-center gap-2">
            <span className="bg-slate-100 px-1.5 py-0.5 rounded text-slate-500">{item.category} &gt; {item.subCategory}</span>
            {item.plan && <span className="text-blue-500"><i className="fas fa-tools mr-1"></i>{item.plan}</span>}
          </div>
        </td>
        <td className="p-4 text-center">
          {item.imageUrl ? (
             <div className="inline-flex w-8 h-8 items-center justify-center bg-emerald-50 text-emerald-600 border border-emerald-100 rounded-lg"><i className="fas fa-image"></i></div>
          ) : (
             <div className="inline-flex w-8 h-8 items-center justify-center bg-slate-50 text-slate-300 border border-slate-100 rounded-lg group-hover:bg-blue-50 group-hover:text-blue-400 transition-colors"><i className="fas fa-camera"></i></div>
          )}
        </td>
        <td className="p-4 text-center">
          <button 
            onClick={(e) => { e.stopPropagation(); onToggleStatus(item.id, item.status); }}
            className={`inline-flex items-center px-3 py-1.5 rounded-full text-[11px] font-black shadow-sm border transition-transform active:scale-95 ${
              item.status === '완료' 
                ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100' 
                : 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100'
            }`}
          >
            <i className={`fas ${item.status === '완료' ? 'fa-check-circle' : 'fa-clock'} mr-1.5`}></i>
            {item.status.toUpperCase()}
          </button>
        </td>
      </tr>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
